name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Every module — the Android bridge and the sample app too, against the runner's preinstalled SDK — and the
      # whole suite: the parser, settling, the bridge over a real socket, the CLI's help pages, the coverage guards,
      # and CONTRACT.md's examples reproduced byte for byte.
      - name: Build and test
        run: ./gradlew build

      # The example app is also the end-to-end fixture: three scenario files through the real CLI, built from the
      # same agentctl-cli a host app would use.
      - name: Example scenarios
        run: ./tinyctl test

      # The example's committed command reference is generated from its agent declarations; --check fails if a
      # change to a screen's commands or summary keys never made it into the document.
      - name: Generated command reference is current
        run: ./tinyctl docs --check

      # The release APK holds none of AgentCtl's runtime, CLI, test support or bridge: TinyApp's and AgentShop's
      # configs are debugImplementation dependencies, as a host's should be. (`build` has run it already, as part of `check`.)
      - name: Release build leaves out AgentCtl
        run: ./gradlew :examples:tinyapp-android:verifyReleaseLeavesOutAgentCtl :examples:agentshop:app:verifyReleaseLeavesOutAgentCtl

      # AgentShop, the showcase: its 105 scenarios (the reference's, byte for byte) through its own CLI, run from
      # examples/agentshop, its root.
      - name: AgentShop scenarios
        run: examples/agentshop/appctl test

      - name: AgentShop command reference is current
        run: examples/agentshop/appctl docs --check

      # What JitPack runs for a tag: every published module installs.
      - name: Publish locally
        run: ./gradlew publishToMavenLocal
